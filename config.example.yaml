# obsideo-provider configuration example.
# Copy to config.yaml and edit before running.

provider_id: ""               # the id the coordinator returned at registration (`obsideo-provider init` fills this in).
                               # The heartbeat URL is built from it, so a made-up label here means the node never goes live.

server:
  host: "0.0.0.0"              # bind address; put a reverse proxy in front to terminate TLS on 443
  port: 3334
  read_timeout: 30
  write_timeout: 300
  # cors_enabled: true          # browser clients (the obsideo.io test page, customer web apps) may call
  #                             # upload/download/client-challenge/delete/health directly. Default true.
  # cors_allowed_origins: ["*"] # restrict to specific web origins if you want; every one of those routes
  #                             # is already token- or signature-authenticated, so "*" adds no risk.

data:
  path: "./data"               # objects/, index/, and provider_identity.key are created here on first run

tokens:
  public_key_path: "coordinator_pub.pem"
  # The coordinator's public key. Fetch it from the coordinator directly:
  #   curl -sS https://coordinator.obsideo.io/public-key > coordinator_pub.pem
  # It is a PEM block whose body is the raw 32-byte Ed25519 key. The provider
  # refuses to start without it.

coordinator:
  url: "https://coordinator.obsideo.io"   # the coordinator you register with and heartbeat to
  provider_api_key: ""                     # issued when Obsideo approves your registration; delivered out of band

coverage:
  enabled: true                # daily "which of my objects are still paid-for?" refresh; keep true for a live node
